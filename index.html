<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>燃料ラン！</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#1a2233; font-family:'Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #wrap { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#87b5e0; border-radius:8px; }
  #muteBtn { position:absolute; top:10px; right:10px; z-index:5; background:rgba(255,255,255,.85); border:none; border-radius:999px; width:42px; height:42px; font-size:20px; cursor:pointer; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <button id="muteBtn" title="音 ON/OFF">🔊</button>
</div>
<script>
'use strict';
// ===== 燃料ラン！ =====
// 後ろ姿視点の疑似3Dドライブ。オートアクセル、左右移動のみ。
// 燃料缶 ⛽ を拾って燃料を保ち、走行距離を競う。
const W = 420, H = 640;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.width = W; cv.height = H;
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

// 透視：t=0 地平線 / t=1 手前
const HORIZON = 190;
function projY(t) { return HORIZON + t * (H - HORIZON); }
function centerX(t) { return W / 2 + curveCur * 150 * t * t; }   // カーブで道路中心がずれる
function roadHalf(t) { return 26 + t * (190 - 26); }   // 道路の半幅(px)
function objScale(t) { return 0.12 + t * t * 1.15; }

// ===== 音（WebAudio シンセ） =====
let actx = null, muted = false;
function beep(freq, dur, type, vol, when) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + (when || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.06, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) { /* 音が出ない環境では無視 */ }
}
const sndPickup = () => { beep(880, .09, 'square', .07); beep(1320, .14, 'square', .07, .08); };
const sndBad    = () => { beep(150, .22, 'sawtooth', .09); beep(90, .3, 'sawtooth', .09, .1); };
const sndWarn   = () => beep(220, .12, 'sawtooth', .05);
const sndOver   = () => { beep(392, .18, 'triangle', .08); beep(330, .18, 'triangle', .08, .18); beep(262, .34, 'triangle', .08, .36); };
const sndStart  = () => { beep(523, .1, 'square', .06); beep(659, .1, 'square', .06, .1); beep(784, .16, 'square', .06, .2); };
document.getElementById('muteBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  muted = !muted;
  e.target.textContent = muted ? '🔇' : '🔊';
});

// ===== ゲーム状態 =====
let state = 'title';            // title | play | over
let px = 0, pTarget = 0;        // プレイヤーの道路内位置 -1..1
let speedKmh = 0;               // 表示速度
let dist = 0;                   // 走行距離 m
let fuel = 100;
let fuels = [];                 // {t, lane}
let spawnTimer = 0, warnTimer = 0, elapsed = 0, sputterT = 0;
let curveCur = 0, curveTarget = 0, curveTimer = 4;   // カーブ（-1..1、+で右へ曲がる）
let leanSm = 0, prevPx = 0, lastRatio = 0;           // 車体の傾き（リーン）用
let scenery = [], nextSceneryAt = 0;                 // 道路わきの景色オブジェクト
let clouds = [];
for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * W, y: 18 + Math.random() * 100, s: 0.7 + Math.random() * 0.6, v: 2 + Math.random() * 4 });
let best = parseInt(localStorage.getItem('fuelrun_best') || '0', 10);
let keys = { left: false, right: false };
let steerDrag = null;           // タッチ中の x (canvas座標)

function reset() {
  px = 0; pTarget = 0; speedKmh = 60; dist = 0; fuel = 100;
  fuels = []; spawnTimer = 0.6; warnTimer = 0; elapsed = 0; sputterT = 0;
  curveCur = 0; curveTarget = 0; curveTimer = 4;
}

function startGame() { reset(); state = 'play'; sndStart(); }

// ===== 入力 =====
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') startGame();
  if (e.key.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});
function canvasX(clientX) {
  const r = cv.getBoundingClientRect();
  return (clientX - r.left) / r.width * W;
}
cv.addEventListener('pointerdown', (e) => {
  if (state !== 'play') { startGame(); return; }
  steerDrag = canvasX(e.clientX);
});
cv.addEventListener('pointermove', (e) => { if (steerDrag !== null) steerDrag = canvasX(e.clientX); });
window.addEventListener('pointerup', () => { steerDrag = null; });
window.addEventListener('pointercancel', () => { steerDrag = null; });

// ===== 更新 =====
function update(dt) {
  if (state !== 'play') return;
  elapsed += dt;
  // オートアクセル：上限なしで加速し続ける
  speedKmh += dt * (5 + speedKmh * 0.006);
  if (sputterT > 0) sputterT -= dt;
  const eff = speedKmh * (sputterT > 0 ? 0.55 : 1);   // 水缶でエンジン不調中は失速
  const v = eff / 3.6;                                 // m/s
  dist += v * dt;
  const ratio = eff / (eff + 260);                     // 速度の効き具合（0→1に漸近）
  // 燃料消費（速度に比例）
  fuel -= dt * (1.8 + ratio * 2.2);
  // ステアリング（速いほど少しキビキビ）
  const steerSpeed = 2.6 + ratio * 1.3;
  if (keys.left) pTarget -= steerSpeed * dt;
  if (keys.right) pTarget += steerSpeed * dt;
  if (steerDrag !== null) {
    // ドラッグ位置を道路内位置へ（プレイヤー高さでの道路中心と幅で換算）
    const half = roadHalf(0.92);
    pTarget = Math.max(-1.05, Math.min(1.05, (steerDrag - centerX(0.92)) / half));
  }
  pTarget = Math.max(-1.05, Math.min(1.05, pTarget));
  px += (pTarget - px) * Math.min(1, dt * 10);
  // カーブ：遠心力で車体が外側へ流れる
  curveTimer -= dt;
  if (curveTimer <= 0) {
    curveTarget = Math.random() < 0.3 ? 0 : (Math.random() * 2 - 1);
    curveTimer = 5 + Math.random() * 4;
  }
  curveCur += (curveTarget - curveCur) * Math.min(1, dt * 0.8);
  px -= curveCur * (0.30 + 0.45 * ratio) * dt;
  px = Math.max(-1.05, Math.min(1.05, px));
  // 車体の傾き：横移動の勢いから目標リーン角を作って滑らかに追う
  lastRatio = ratio;
  const pxVel = (px - prevPx) / Math.max(dt, 0.001);
  prevPx = px;
  const targetLean = Math.max(-0.30, Math.min(0.30, pxVel * 0.09));
  leanSm += (targetLean - leanSm) * Math.min(1, dt * 10);
  // 景色オブジェクトの生成と接近（実距離ベース）
  nextSceneryAt -= v * dt;
  if (nextSceneryAt <= 0) {
    const types = ['tree', 'pine', 'sign', 'flower', 'rock'];
    scenery.push({ z: 175, side: Math.random() < 0.5 ? -1 : 1, type: types[Math.floor(Math.random() * types.length)], off: 0.9 + Math.random() * 0.8 });
    nextSceneryAt = 20 + Math.random() * 22;
  }
  for (const o of scenery) o.z -= v * dt;
  scenery = scenery.filter(o => o.z > 2);
  for (const c of clouds) { c.x -= (c.v + curveCur * 14) * dt; if (c.x < -70) { c.x = W + 70; c.y = 18 + Math.random() * 100; } }
  // 燃料缶の出現と移動
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    // 12秒を過ぎたら約3割が「水」缶（お邪魔アイテム）
    const kind = (elapsed > 12 && Math.random() < 0.32) ? 'water' : 'gas';
    fuels.push({ t: 0, lane: (Math.random() * 1.7 - 0.85), kind });
    spawnTimer = (2.4 + Math.random() * 1.2) * (140 / (140 + eff));  // 速いほど出現も密に
  }
  // アイテムの接近は実速度（m/s）に比例：速ければ速いほど速く流れてくる
  const approach = v / 150;
  for (const f of fuels) f.t += dt * approach * (0.5 + f.t * 1.2);
  // 取得判定（プレイヤーは t≈0.92 の高さ）
  fuels = fuels.filter((f) => {
    if (f.t > 1.05) return false;
    if (f.t > 0.84 && f.t < 1.0 && Math.abs(f.lane - px) < 0.34) {
      if (f.kind === 'water') {
        fuel = Math.max(0, fuel - 18);
        sputterT = 1.2;
        sndBad();
      } else {
        fuel = Math.min(100, fuel + 25);
        sndPickup();
      }
      return false;
    }
    return true;
  });
  // 燃料警告
  if (fuel < 25) { warnTimer -= dt; if (warnTimer <= 0) { sndWarn(); warnTimer = 1.0; } }
  if (fuel <= 0) {
    fuel = 0; state = 'over'; sndOver();
    const d = Math.floor(dist);
    if (d > best) { best = d; localStorage.setItem('fuelrun_best', String(best)); }
  }
}

// ===== 描画 =====
function drawCloud(c) {
  ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.arc(18, -6, 20, 0, Math.PI * 2);
  ctx.arc(38, 0, 15, 0, Math.PI * 2); ctx.arc(19, 6, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function drawRoad() {
  // 空と遠景（カーブ方向と逆へ少し流して視差を出す）
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, '#5aa9e6'); sky.addColorStop(1, '#cfe8f7');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, HORIZON);
  ctx.save();
  ctx.translate(-curveCur * 24, 0);
  ctx.fillStyle = '#f7d774';
  ctx.beginPath(); ctx.arc(W - 66, 52, 24, 0, Math.PI * 2); ctx.fill();   // 太陽
  ctx.fillStyle = '#ffe9a0';
  ctx.beginPath(); ctx.arc(W - 66, 52, 30, 0, Math.PI * 2); ctx.globalAlpha = 0.35; ctx.fill(); ctx.globalAlpha = 1;
  // 遠くの山（三角シルエット）
  ctx.fillStyle = '#8fb8dd';
  ctx.beginPath();
  ctx.moveTo(-40, HORIZON); ctx.lineTo(40, HORIZON - 74); ctx.lineTo(110, HORIZON);
  ctx.lineTo(190, HORIZON - 58); ctx.lineTo(260, HORIZON); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#7fae6e';
  ctx.beginPath();                                                        // 丘
  ctx.moveTo(-40, HORIZON); ctx.quadraticCurveTo(90, HORIZON - 52, 210, HORIZON);
  ctx.quadraticCurveTo(320, HORIZON - 40, W + 40, HORIZON); ctx.closePath(); ctx.fill();
  ctx.restore();
  clouds.forEach(drawCloud);
  // 地面：緑の縞（距離で流れて速度感を出す）
  ctx.fillStyle = '#79b657'; ctx.fillRect(0, HORIZON, W, H - HORIZON);
  const bandN = 7;
  const boff = (dist * 0.045) % 1;
  ctx.fillStyle = '#8cc96e';
  for (let i = 0; i < bandN; i += 2) {
    let t = (i + boff) / bandN; if (t > 1) t -= 1;
    const t2 = Math.min(1, t + 1 / bandN);
    ctx.fillRect(0, projY(t), W, projY(t2) - projY(t) + 1);
  }
  // 道路（カーブに沿って中心がずれる帯）
  ctx.fillStyle = '#62687a';
  ctx.beginPath();
  const SEG = 12;
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG, x = centerX(t) - roadHalf(t), y = projY(t);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  for (let i = SEG; i >= 0; i--) {
    const t = i / SEG;
    ctx.lineTo(centerX(t) + roadHalf(t), projY(t));
  }
  ctx.closePath(); ctx.fill();
  // 縁石（流れるストライプ）
  const stripeN = 7;
  const off = (dist * 0.045) % 1;
  for (let i = 0; i < stripeN; i++) {
    let t = (i + off) / stripeN; if (t > 1) t -= 1;
    const t2 = Math.min(1, t + 0.055);
    const c1 = centerX(t), c2 = centerX(t2);
    for (const side of [-1, 1]) {
      ctx.fillStyle = (i % 2 === 0) ? '#e8e8e8' : '#d84a4a';
      ctx.beginPath();
      ctx.moveTo(c1 + side * roadHalf(t), projY(t));
      ctx.lineTo(c2 + side * roadHalf(t2), projY(t2));
      ctx.lineTo(c2 + side * (roadHalf(t2) + 5 + t2 * 9), projY(t2));
      ctx.lineTo(c1 + side * (roadHalf(t) + 5 + t * 9), projY(t));
      ctx.closePath(); ctx.fill();
    }
    // 中央線
    if (i % 2 === 0) {
      ctx.fillStyle = '#f5f0c8';
      const w1 = 1.5 + t * 5, w2 = 1.5 + t2 * 5;
      ctx.beginPath();
      ctx.moveTo(c1 - w1 / 2, projY(t)); ctx.lineTo(c1 + w1 / 2, projY(t));
      ctx.lineTo(c2 + w2 / 2, projY(t2)); ctx.lineTo(c2 - w2 / 2, projY(t2));
      ctx.closePath(); ctx.fill();
    }
  }
}

function drawSceneryObj(o) {
  const t = 1 - o.z / 175;
  if (t <= 0 || t > 1) return;
  const x = centerX(t) + o.side * (roadHalf(t) + (12 + t * 95) * o.off);
  const y = projY(t);
  const s = objScale(t) * 1.5;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (o.type === 'tree') {
    ctx.fillStyle = '#8a5a33'; roundRect(-3, -16, 6, 16, 2); ctx.fill();
    ctx.fillStyle = '#3f9e4d';
    ctx.beginPath(); ctx.arc(0, -26, 15, 0, Math.PI * 2); ctx.arc(-11, -17, 10, 0, Math.PI * 2); ctx.arc(11, -17, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e2483d';
    ctx.beginPath(); ctx.arc(-6, -24, 2.6, 0, Math.PI * 2); ctx.arc(7, -30, 2.6, 0, Math.PI * 2); ctx.fill();
  } else if (o.type === 'pine') {
    ctx.fillStyle = '#8a5a33'; roundRect(-2.5, -10, 5, 10, 2); ctx.fill();
    ctx.fillStyle = '#2e7d46';
    for (let i = 0; i < 3; i++) {
      const wdt = 17 - i * 4, yy = -10 - i * 10;
      ctx.beginPath(); ctx.moveTo(-wdt, yy); ctx.lineTo(wdt, yy); ctx.lineTo(0, yy - 13); ctx.closePath(); ctx.fill();
    }
  } else if (o.type === 'sign') {
    ctx.fillStyle = '#9aa0a8'; roundRect(-2, -30, 4, 30, 2); ctx.fill();
    ctx.fillStyle = '#f5f0c8'; roundRect(-13, -42, 26, 15, 3); ctx.fill();
    ctx.fillStyle = '#d8402f'; ctx.font = 'bold 11px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(o.side > 0 ? '▶' : '◀', 0, -34);
  } else if (o.type === 'flower') {
    const cols = ['#ff7eb6', '#ffd23e', '#ffffff', '#ff9f43'];
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = cols[i % 4];
      ctx.beginPath(); ctx.arc(-14 + i * 5.5, -2 - (i % 3) * 2, 2.4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = '#3f9e4d'; ctx.fillRect(-17, -2, 34, 3);
  } else { // rock
    ctx.fillStyle = '#9aa0a8';
    ctx.beginPath();
    ctx.moveTo(-13, 0); ctx.lineTo(-8, -11); ctx.lineTo(2, -15); ctx.lineTo(12, -7); ctx.lineTo(13, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#b7bdc4';
    ctx.beginPath(); ctx.moveTo(-8, -11); ctx.lineTo(2, -15); ctx.lineTo(5, -6); ctx.lineTo(-3, -5); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawFuelCan(f) {
  // 燃料缶と水缶：同型の携行缶、ラベルの色と文字だけ違う（見分けは一瞬の判断）
  const x = centerX(f.t) + f.lane * roadHalf(f.t);
  const y = projY(f.t);
  const s = objScale(f.t);
  const gas = f.kind !== 'water';
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  // 影
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(0, 2, 20, 5, 0, 0, Math.PI * 2); ctx.fill();
  // 取っ手
  ctx.fillStyle = gas ? '#a52a20' : '#5d5348';
  roundRect(-13, -52, 26, 9, 4); ctx.fill();
  // 本体
  ctx.fillStyle = gas ? '#d8402f' : '#8a7a63';
  roundRect(-19, -46, 38, 46, 6); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  roundRect(-19, -46, 12, 46, 6); ctx.fill();
  // ラベル
  ctx.fillStyle = '#fff';
  roundRect(-12, -36, 24, 24, 3); ctx.fill();
  ctx.fillStyle = gas ? '#d8402f' : '#2266aa';
  ctx.font = 'bold 17px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(gas ? '燃' : '水', 0, -23);
  ctx.restore();
}

function drawPlayer() {
  const py = projY(0.92);
  const x = centerX(0.92) + px * roadHalf(0.92);
  ctx.save();
  ctx.translate(x, py + Math.sin(elapsed * 26) * (0.5 + lastRatio * 1.1));  // 走行バウンス
  ctx.rotate(leanSm - curveCur * 0.04);                                     // 左右移動で車体が傾く
  // 影
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(0, 18, 62, 10, 0, 0, Math.PI * 2); ctx.fill();
  // 後輪（太いスリックタイヤ）
  for (const sx of [-1, 1]) {
    ctx.fillStyle = '#1d1d22';
    roundRect(sx * 62 - 14, -14, 28, 34, 9); ctx.fill();
    ctx.fillStyle = '#33333c';
    roundRect(sx * 62 - 14, -14, 9, 34, 5); ctx.fill();
    ctx.fillStyle = '#c8ccd4';
    ctx.beginPath(); ctx.arc(sx * 62, 3, 6, 0, Math.PI * 2); ctx.fill();
  }
  // リアウイング
  ctx.fillStyle = '#8f1f16';
  roundRect(-34, -66, 8, 18, 3); ctx.fill();
  roundRect(26, -66, 8, 18, 3); ctx.fill();
  const wingGrad = ctx.createLinearGradient(0, -82, 0, -68);
  wingGrad.addColorStop(0, '#f0563f'); wingGrad.addColorStop(1, '#c03325');
  ctx.fillStyle = wingGrad;
  roundRect(-60, -82, 120, 13, 6); ctx.fill();
  ctx.fillStyle = '#8f1f16';
  roundRect(-62, -84, 7, 17, 3); ctx.fill();
  roundRect(55, -84, 7, 17, 3); ctx.fill();
  // 車体（カートらしい低いフォルム）
  const bodyGrad = ctx.createLinearGradient(0, -56, 0, 20);
  bodyGrad.addColorStop(0, '#f0563f'); bodyGrad.addColorStop(1, '#b02a20');
  ctx.fillStyle = bodyGrad;
  roundRect(-52, -54, 104, 72, 16); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.20)';
  roundRect(-52, -54, 30, 72, 16); ctx.fill();
  // 排気管×2（不調時は黒煙）
  for (const sx of [-1, 1]) {
    ctx.fillStyle = '#7d838e';
    roundRect(sx * 31 - 6, 8, 12, 10, 3); ctx.fill();
    ctx.fillStyle = '#3c4048';
    roundRect(sx * 31 - 4, 14, 8, 4, 2); ctx.fill();
  }
  if (sputterT > 0) {
    ctx.fillStyle = 'rgba(40,40,40,.5)';
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.arc((Math.random() - .5) * 56, 2 - Math.random() * 16, 5 + Math.random() * 6, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (state === 'play' && Math.random() < 0.35) {
    // 加速時の炎チラッ
    ctx.fillStyle = '#ff9f43';
    ctx.beginPath();
    ctx.moveTo(-35, 18); ctx.lineTo(-27, 18); ctx.lineTo(-31, 27 + Math.random() * 5); ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(27, 18); ctx.lineTo(35, 18); ctx.lineTo(31, 27 + Math.random() * 5); ctx.closePath(); ctx.fill();
  }
  // シートと運転手（青いツナギ＋腕）
  ctx.fillStyle = '#2b2b30';
  roundRect(-25, -64, 50, 30, 9); ctx.fill();
  ctx.fillStyle = '#2456c8';                                   // ツナギの背中
  roundRect(-24, -88, 48, 32, 13); ctx.fill();
  ctx.fillStyle = '#d8402f';                                   // 袖（腕）
  ctx.save(); ctx.translate(-27, -80); ctx.rotate(0.5); roundRect(-6, 0, 13, 30, 6); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(27, -80); ctx.rotate(-0.5); roundRect(-7, 0, 13, 30, 6); ctx.fill(); ctx.restore();
  ctx.fillStyle = '#f2c79b';                                   // 手
  ctx.beginPath(); ctx.arc(-38, -52, 6, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(38, -52, 6, 0, Math.PI * 2); ctx.fill();
  // ヘルメット（白＋赤ストライプ）頭は車体より少し大きく傾く
  ctx.save();
  ctx.translate(leanSm * 14, 0);
  ctx.rotate(leanSm * 0.55);
  ctx.fillStyle = '#f7f7f7';
  ctx.beginPath(); ctx.arc(0, -94, 17, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d8232a';
  ctx.beginPath(); ctx.arc(0, -94, 17, Math.PI * 1.15, Math.PI * 1.85); ctx.fill();
  roundRect(-3.5, -111, 7, 34, 3); ctx.fill();
  ctx.fillStyle = '#2c3e50';
  roundRect(-13, -88, 26, 5, 2); ctx.fill();                   // 後頭部のバイザー影
  ctx.restore();
  // テールランプとナンバー
  ctx.fillStyle = '#ffd23e';
  roundRect(-48, -18, 18, 8, 4); ctx.fill();
  roundRect(30, -18, 18, 8, 4); ctx.fill();
  ctx.fillStyle = '#fff';
  roundRect(-16, -20, 32, 15, 3); ctx.fill();
  ctx.fillStyle = '#333'; ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('58-39', 0, -12);
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawHUD() {
  // カーブ表示
  if (state === 'play' && Math.abs(curveCur) > 0.3) {
    ctx.fillStyle = 'rgba(0,0,0,.45)';
    roundRect(W / 2 - 56, 10, 112, 30, 8); ctx.fill();
    ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText((curveCur > 0 ? '右' : '左') + 'カーブ ' + (curveCur > 0 ? '>>>' : '<<<'), W / 2, 26);
    ctx.textBaseline = 'alphabetic';
  }
  // 距離
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  roundRect(10, 10, 168, 56, 10); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = 'bold 22px sans-serif';
  ctx.fillText((dist / 1000).toFixed(2) + ' km', 20, 36);
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#cfe3ff';
  ctx.fillText('ベスト ' + (best / 1000).toFixed(2) + ' km', 20, 56);
  // 速度
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  roundRect(W - 118, 10, 108, 56, 10); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(Math.round(speedKmh) + '', W - 44, 38);
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#cfe3ff';
  ctx.fillText('km/h', W - 16, 38);
  ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText('オート加速中', W - 16, 56);
  // 燃料ゲージ
  const gw = W - 40;
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  roundRect(10, H - 44, gw + 20, 34, 10); ctx.fill();
  ctx.font = '15px serif'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('⛽', 18, H - 26);
  const fw = gw - 26;
  ctx.fillStyle = '#3a3f46'; roundRect(42, H - 35, fw, 16, 8); ctx.fill();
  ctx.fillStyle = fuel < 25 ? '#e2483d' : '#ffd23e';
  if (fuel > 0.5) { roundRect(42, H - 35, fw * fuel / 100, 16, 8); ctx.fill(); }
}

function drawOjisan(x, y, s) {
  // 某・赤い帽子のヒゲのおじさん（オリジナルの描き起こし）
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  // 体（青いオーバーオール＋赤シャツ）
  ctx.fillStyle = '#2456c8'; roundRect(-26, 26, 52, 42, 10); ctx.fill();
  ctx.fillStyle = '#d8402f'; roundRect(-35, 28, 14, 30, 6); ctx.fill(); roundRect(21, 28, 14, 30, 6); ctx.fill();
  ctx.fillStyle = '#ffd23e';
  ctx.beginPath(); ctx.arc(-10, 41, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(10, 41, 3.5, 0, Math.PI * 2); ctx.fill();
  // 顔と耳
  ctx.fillStyle = '#f2c79b';
  ctx.beginPath(); ctx.arc(0, 0, 26, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-26, 2, 7, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(26, 2, 7, 0, Math.PI * 2); ctx.fill();
  // 鼻
  ctx.fillStyle = '#eda96f';
  ctx.beginPath(); ctx.arc(0, 6, 8, 0, Math.PI * 2); ctx.fill();
  // ヒゲ
  ctx.fillStyle = '#3a2a1c';
  ctx.beginPath(); ctx.ellipse(-9, 13, 10, 5.5, -0.25, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(9, 13, 10, 5.5, 0.25, 0, Math.PI * 2); ctx.fill();
  // 目
  ctx.fillStyle = '#26221e';
  ctx.beginPath(); ctx.arc(-10, -3, 3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(10, -3, 3, 0, Math.PI * 2); ctx.fill();
  // 赤い帽子
  ctx.fillStyle = '#d8232a';
  ctx.beginPath(); ctx.arc(0, -8, 26, Math.PI, Math.PI * 2); ctx.fill();
  roundRect(-27, -11, 54, 6, 3); ctx.fill();
  ctx.beginPath(); ctx.ellipse(16, -4, 17, 5, 0, 0, Math.PI * 2); ctx.fill();
  // 帽子の白丸マーク
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(0, -19, 9, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#d8232a'; ctx.font = 'bold 12px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('★', 0, -18.5);
  ctx.restore();
}

function drawTitle() {
  drawRoad();
  ctx.fillStyle = 'rgba(20,28,44,.55)'; ctx.fillRect(0, 0, W, H);
  drawOjisan(W / 2, 92, 0.95);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold 52px sans-serif';
  ctx.fillText('燃料ラン！', W / 2, 208);
  ctx.font = '16px sans-serif';
  ctx.fillText('基本オートアクセル。左右に動くだけ！', W / 2, 292);
  ctx.fillText('赤い「燃」缶を拾って燃料を保ち、', W / 2, 320);
  ctx.fillText('茶色い「水」缶はエンジン不調！避けろ', W / 2, 346);
  ctx.fillText('どこまで走れるか競おう（速度上限なし）', W / 2, 372);
  ctx.font = '14px sans-serif'; ctx.fillStyle = '#cfe3ff';
  ctx.fillText('操作：←→キー ／ 画面ドラッグ', W / 2, 408);
  if (best > 0) { ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 17px sans-serif'; ctx.fillText('自己ベスト ' + (best / 1000).toFixed(2) + ' km', W / 2, 438); }
  ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 22px sans-serif';
  ctx.fillText('タップ / スペースでスタート', W / 2, 505);
}

function drawOver() {
  drawRoad();
  drawPlayer();
  ctx.fillStyle = 'rgba(20,28,44,.62)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold 38px sans-serif';
  ctx.fillText('ガス欠…！', W / 2, 210);
  ctx.font = '16px sans-serif';
  ctx.fillText('記録', W / 2, 268);
  ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 48px sans-serif';
  ctx.fillText((Math.floor(dist) / 1000).toFixed(2) + ' km', W / 2, 322);
  ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif';
  ctx.fillText('自己ベスト ' + (best / 1000).toFixed(2) + ' km', W / 2, 362);
  if (Math.floor(dist) >= best && best > 0) {
    ctx.fillStyle = '#7ee787'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText('🎉 ベスト更新！', W / 2, 394);
  }
  ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 20px sans-serif';
  ctx.fillText('タップ / スペースでもう一回', W / 2, 470);
}

function draw() {
  if (state === 'title') { drawTitle(); return; }
  ctx.save();
  if (sputterT > 0) ctx.translate((Math.random() - .5) * 7, (Math.random() - .5) * 7);  // 不調時は画面が揺れる
  drawRoad();
  // 遠い順に描く（景色→アイテム）
  [...scenery].sort((a, b) => b.z - a.z).forEach(drawSceneryObj);
  [...fuels].sort((a, b) => a.t - b.t).forEach(drawFuelCan);
  drawPlayer();
  ctx.restore();
  drawHUD();
  if (state === 'over') drawOver();
}

// ===== メインループ =====
let lastTs = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
  lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
