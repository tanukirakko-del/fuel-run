<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>燃料ラン！</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; background:#1a2233; font-family:'Hiragino Maru Gothic ProN','Hiragino Sans',sans-serif; overflow:hidden; touch-action:none; user-select:none; -webkit-user-select:none; }
  #wrap { position:relative; width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#87b5e0; border-radius:8px; }
  #muteBtn { position:absolute; top:10px; right:10px; z-index:5; background:rgba(255,255,255,.85); border:none; border-radius:999px; width:42px; height:42px; font-size:20px; cursor:pointer; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <button id="muteBtn" title="音 ON/OFF">🔊</button>
</div>
<script>
'use strict';
// ===== 燃料ラン！ =====
// 後ろ姿視点の疑似3Dドライブ。オートアクセル、左右移動のみ。
// 燃料缶 ⛽ を拾って燃料を保ち、走行距離を競う。
const W = 420, H = 640;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function fit() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  cv.width = W; cv.height = H;
  cv.style.width = (W * s) + 'px'; cv.style.height = (H * s) + 'px';
}
window.addEventListener('resize', fit); fit();

// 透視：t=0 地平線 / t=1 手前
const HORIZON = 190;
function projY(t) { return HORIZON + t * (H - HORIZON); }
function centerX(t) { return W / 2 + curveCur * 150 * t * t; }   // カーブで道路中心がずれる
function roadHalf(t) { return 26 + t * (190 - 26); }   // 道路の半幅(px)
function objScale(t) { return 0.12 + t * t * 1.15; }

// ===== 音（WebAudio シンセ） =====
let actx = null, muted = false;
function beep(freq, dur, type, vol, when) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t0 = actx.currentTime + (when || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.06, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t0); o.stop(t0 + dur);
  } catch (e) { /* 音が出ない環境では無視 */ }
}
const sndPickup = () => { beep(880, .09, 'square', .07); beep(1320, .14, 'square', .07, .08); };
const sndBad    = () => { beep(150, .22, 'sawtooth', .09); beep(90, .3, 'sawtooth', .09, .1); };
const sndBoom   = () => { beep(70, .5, 'sawtooth', .13); beep(50, .7, 'square', .1, .08); beep(120, .3, 'sawtooth', .08, .03); };
const sndArea   = () => { beep(659, .09, 'square', .06); beep(988, .15, 'square', .06, .09); };
const sndWarn   = () => beep(220, .12, 'sawtooth', .05);
const sndOver   = () => { beep(392, .18, 'triangle', .08); beep(330, .18, 'triangle', .08, .18); beep(262, .34, 'triangle', .08, .36); };
const sndStart  = () => { beep(523, .1, 'square', .06); beep(659, .1, 'square', .06, .1); beep(784, .16, 'square', .06, .2); };
document.getElementById('muteBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  muted = !muted;
  e.target.textContent = muted ? '🔇' : '🔊';
});

// ===== ゲーム状態 =====
let state = 'title';            // title | play | over
let px = 0, pTarget = 0;        // プレイヤーの道路内位置 -1..1
let speedKmh = 0;               // 表示速度
let dist = 0;                   // 走行距離 m
let fuel = 100;
let fuels = [];                 // {t, lane}
let spawnTimer = 0, warnTimer = 0, elapsed = 0, sputterT = 0;
let dmg = 0, overReason = null, boomT0 = 0, isOff = false;   // 水缶ダメージ／終了理由／道外判定
let pull = 0, inputVelSm = 0;                                 // 惰性の引っ張り（ステアと反対方向へ溜まる）
let themeIdx = 0, themeSeg = 0, nextThemeAt = 3000;          // 背景エリア
let bannerT = 0, bannerTxt = '';
const THEMES = [
  { name: '山',    icon: '⛰️', sky: ['#5aa9e6', '#cfe8f7'], back: 'hills', hill: '#7fae6e', mtn: '#8fb8dd', g1: '#79b657', g2: '#8cc96e', road: '#62687a', sun: 'sun' },
  { name: '海',    icon: '🌊', sky: ['#4fb3e8', '#dff6ff'], back: 'sea',   sea: '#2f9fd8', sand: '#f2ddab', g1: '#f2ddab', g2: '#ecd096', road: '#6b7183', sun: 'sun' },
  { name: 'ビル街', icon: '🏙️', sky: ['#7d9fd1', '#e8eef7'], back: 'city',  city: '#5a6c8c', g1: '#8f9779', g2: '#a3ad8d', road: '#565d6e', sun: 'sun' },
  { name: '夜空',  icon: '🌙', sky: ['#0d1b3e', '#274069'], back: 'hills', hill: '#1d2f26', mtn: '#16283f', g1: '#274d33', g2: '#2f5c3e', road: '#3c4356', sun: 'moon', night: true },
  { name: '夕焼け', icon: '🌇', sky: ['#ff9a56', '#ffd9a0'], back: 'hills', hill: '#8c5a44', mtn: '#a06a52', g1: '#6f7d3a', g2: '#7f9046', road: '#5d5560', sun: 'sunset' },
  { name: '雪山',  icon: '❄️', sky: ['#a8cdea', '#f4faff'], back: 'hills', hill: '#e8f1f8', mtn: '#cfe0f2', g1: '#eef4fa', g2: '#e2ecf6', road: '#7a8194', sun: 'sun' },
  { name: '砂漠',  icon: '🏜️', sky: ['#f7c873', '#fdeecb'], back: 'dunes', dune: '#e8b96f', dune2: '#dfa856', g1: '#eec27c', g2: '#e5b96e', road: '#8a7a63', sun: 'sun' },
];
const POOLS = [
  ['tree', 'pine', 'sign', 'flower', 'rock'],
  ['palm', 'rock', 'sign', 'flower', 'palm'],
  ['lamp', 'sign', 'tree', 'lamp', 'rock'],
  ['tree', 'pine', 'lamp', 'rock', 'sign'],
  ['tree', 'rock', 'sign', 'pine', 'flower'],
  ['pine', 'pine', 'rock', 'sign', 'tree'],
  ['cactus', 'rock', 'sign', 'cactus', 'rock'],
];
let curveCur = 0, curveTarget = 0, curveTimer = 4;   // カーブ（-1..1、+で右へ曲がる）
let leanSm = 0, prevPx = 0, lastRatio = 0;           // 車体の傾き（リーン）用
let stripePhase = 0, stripeAlpha = 1, lastV = 0;     // 縁石・中央線の流れ（目が回らないよう制御）
// PNGスプライト（読み込めない間はCanvas描画にフォールバック）
const IMG = {};
for (const n of ['kart', 'gas', 'water', 'ojisan', 'kart_dmg1', 'kart_dmg2', 'bg0', 'bg1', 'bg2', 'bg3', 'bg4', 'bg5', 'bg6']) { const i = new Image(); i.src = 'assets/' + n + '.png'; IMG[n] = i; }
function hexA(hex, a) { const n = parseInt(hex.slice(1), 16); return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
function imgOk(i) { return i && i.complete && i.naturalWidth > 0; }
let scenery = [], nextSceneryAt = 0;                 // 道路わきの景色オブジェクト
let clouds = [];
for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * W, y: 18 + Math.random() * 100, s: 0.7 + Math.random() * 0.6, v: 2 + Math.random() * 4 });
let best = parseInt(localStorage.getItem('fuelrun_best') || '0', 10);
let keys = { left: false, right: false };
let steerDrag = null;           // タッチ中の x (canvas座標)

function reset() {
  px = 0; pTarget = 0; speedKmh = 60; dist = 0; fuel = 100;
  fuels = []; spawnTimer = 0.6; warnTimer = 0; elapsed = 0; sputterT = 0;
  curveCur = 0; curveTarget = 0; curveTimer = 4;
  dmg = 0; overReason = null; isOff = false;
  pull = 0; inputVelSm = 0;
  themeIdx = 0; themeSeg = 0; nextThemeAt = 3000; bannerT = 0;
}

function startGame() { reset(); state = 'play'; sndStart(); }
function endGame(reason) {
  state = 'over'; overReason = reason;
  if (reason === 'bomb') { boomT0 = performance.now(); sndBoom(); } else { sndOver(); }
  const d = Math.floor(dist);
  if (d > best) { best = d; localStorage.setItem('fuelrun_best', String(best)); }
}

// ===== 入力 =====
window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if ((e.key === ' ' || e.key === 'Enter') && state !== 'play') startGame();
  if (e.key.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', (e) => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});
function canvasX(clientX) {
  const r = cv.getBoundingClientRect();
  return (clientX - r.left) / r.width * W;
}
cv.addEventListener('pointerdown', (e) => {
  if (state !== 'play') { startGame(); return; }
  steerDrag = canvasX(e.clientX);
});
cv.addEventListener('pointermove', (e) => { if (steerDrag !== null) steerDrag = canvasX(e.clientX); });
window.addEventListener('pointerup', () => { steerDrag = null; });
window.addEventListener('pointercancel', () => { steerDrag = null; });

// ===== 更新 =====
function update(dt) {
  if (state !== 'play') return;
  elapsed += dt;
  // オートアクセル：上限なしで加速し続ける
  speedKmh += dt * (5 + speedKmh * 0.006);
  if (sputterT > 0) sputterT -= dt;
  const eff = speedKmh * (sputterT > 0 ? 0.55 : 1) * (isOff ? 0.55 : 1);   // 不調・道外で失速
  const v = eff / 3.6;                                 // m/s
  dist += v * dt;
  lastV = v;
  // 縁石・中央線：速いほど1コマを長くして点滅周期を約7回/秒以下に抑え、濃さも落とす（目が回る対策）
  const segLen = Math.max(22, v / 7);
  stripePhase = (stripePhase + dt * v / segLen) % 1;
  stripeAlpha = Math.max(0.3, Math.min(1, 1.18 - v / 420));
  const ratio = eff / (eff + 260);                     // 速度の効き具合（0→1に漸近）
  // 燃料消費（速度に比例・燃費は悪め）。道外はさらにムダ食い
  fuel -= dt * (2.4 + ratio * 3.0);
  if (isOff) fuel -= dt * 2.2;
  // 背景エリアの切り替え（進むほど1エリアが長くなる）
  if (bannerT > 0) bannerT -= dt;
  if (dist >= nextThemeAt) {
    themeIdx = (themeIdx + 1) % THEMES.length;
    themeSeg++;
    nextThemeAt += 3000 + themeSeg * 1000;
    bannerTxt = '次のエリア：' + THEMES[themeIdx].icon + ' ' + THEMES[themeIdx].name;
    bannerT = 2.2;
    sndArea();
  }
  // ステアリング（速いほど少しキビキビ）
  const ptBefore = pTarget;
  const steerSpeed = 2.9 + ratio * 1.5;
  if (keys.left) pTarget -= steerSpeed * dt;
  if (keys.right) pTarget += steerSpeed * dt;
  if (steerDrag !== null) {
    // ドラッグ位置を道路内位置へ（プレイヤー高さでの道路中心と幅で換算）
    const half = roadHalf(0.92);
    pTarget = Math.max(-1.35, Math.min(1.35, (steerDrag - centerX(0.92)) / half));
  }
  pTarget = Math.max(-1.35, Math.min(1.35, pTarget));
  // 惰性の引っ張り：ステアした反対方向へ力が溜まり、指を止めても／離しても しばらく引っ張り続ける
  const inputVel = Math.max(-7, Math.min(7, (pTarget - ptBefore) / Math.max(dt, 0.001)));
  inputVelSm += (inputVel - inputVelSm) * Math.min(1, dt * 10);
  const curveAmt = Math.min(1, Math.abs(curveCur) / 0.7);   // 反動はカーブ中だけ効かせる
  pull -= inputVelSm * 0.85 * curveAmt * dt;
  pull = Math.max(-1.0, Math.min(1.0, pull));
  pull *= Math.pow(curveAmt < 0.15 ? 0.02 : 0.46, dt);      // 直線では引っ張りを速く消す
  pTarget += pull * dt;
  px += pull * dt;
  // 指で押さえている間は追従を強くして「指に吸い付く」感じに
  px += (pTarget - px) * Math.min(1, dt * (steerDrag !== null ? 16 : 11));
  // カーブ：遠心力で車体が外側へ流れる
  curveTimer -= dt;
  if (curveTimer <= 0) {
    curveTarget = Math.random() < 0.3 ? 0 : (Math.random() * 2 - 1);
    curveTimer = 5 + Math.random() * 4;
  }
  curveCur += (curveTarget - curveCur) * Math.min(1, dt * 0.8);
  // 遠心力は少しマイルドに。カーブ内側へ切っている間／指で押さえている間はグリップが効いてさらに弱まる
  let drift = curveCur * (0.22 + 0.34 * ratio);
  const gripping = steerDrag !== null || (keys.right && curveCur > 0) || (keys.left && curveCur < 0);
  if (gripping) drift *= 0.55;
  px -= drift * dt;
  px = Math.max(-1.35, Math.min(1.35, px));
  isOff = Math.abs(px) > 1.0;   // 道路（|px|<=1）をはみ出したか
  // 車体の傾き：横移動の勢いから目標リーン角を作って滑らかに追う
  lastRatio = ratio;
  const pxVel = (px - prevPx) / Math.max(dt, 0.001);
  prevPx = px;
  const targetLean = Math.max(-0.30, Math.min(0.30, pxVel * 0.09));
  leanSm += (targetLean - leanSm) * Math.min(1, dt * 10);
  // 景色オブジェクトの生成と接近（実距離ベース）
  nextSceneryAt -= v * dt;
  if (nextSceneryAt <= 0) {
    const types = POOLS[themeIdx];
    scenery.push({ z: 175, side: Math.random() < 0.5 ? -1 : 1, type: types[Math.floor(Math.random() * types.length)], off: 0.9 + Math.random() * 0.8 });
    nextSceneryAt = 20 + Math.random() * 22;
  }
  for (const o of scenery) o.z -= v * dt;
  scenery = scenery.filter(o => o.z > 2);
  for (const c of clouds) { c.x -= (c.v + curveCur * 14) * dt; if (c.x < -70) { c.x = W + 70; c.y = 18 + Math.random() * 100; } }
  // 燃料缶の出現と移動
  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    // 12秒を過ぎたら約3割が「水」缶（お邪魔アイテム）
    const kind = (elapsed > 12 && Math.random() < 0.32) ? 'water' : 'gas';
    fuels.push({ t: 0, lane: (Math.random() * 1.7 - 0.85), kind });
    spawnTimer = (3.2 + Math.random() * 1.6) * (140 / (140 + eff));  // 出現頻度は低め。速いほど出現も密に
  }
  // アイテムの接近は実速度（m/s）に比例：速ければ速いほど速く流れてくる
  const approach = v / 150;
  for (const f of fuels) f.t += dt * approach * (0.5 + f.t * 1.2);
  // 取得判定（プレイヤーは t≈0.92 の高さ）
  fuels = fuels.filter((f) => {
    if (f.t > 1.05) return false;
    if (f.t > 0.84 && f.t < 1.0 && Math.abs(f.lane - px) < 0.34) {
      if (f.kind === 'water') {
        fuel = Math.max(0, fuel - 18);
        sputterT = 1.2;
        sndBad();
        dmg++;   // 水缶ダメージ蓄積。10回で爆発
        if (dmg >= 10) { endGame('bomb'); return false; }
      } else {
        fuel = Math.min(100, fuel + 25);
        sndPickup();
      }
      return false;
    }
    return true;
  });
  // 燃料警告
  if (fuel < 25) { warnTimer -= dt; if (warnTimer <= 0) { sndWarn(); warnTimer = 1.0; } }
  if (fuel <= 0 && state === 'play') {
    fuel = 0; endGame('gas');
  }
}

// ===== 描画 =====
function drawCloud(c) {
  ctx.save(); ctx.translate(c.x, c.y); ctx.scale(c.s, c.s);
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.beginPath();
  ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.arc(18, -6, 20, 0, Math.PI * 2);
  ctx.arc(38, 0, 15, 0, Math.PI * 2); ctx.arc(19, 6, 18, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}
function drawRoad() {
  const TH = THEMES[themeIdx];
  // 背景PNG（ある エリアはイラスト背景を優先し、下端を地面色へフェード）
  const bgImg = IMG['bg' + themeIdx];
  const useBg = imgOk(bgImg);
  if (useBg) {
    const bw = W + 60, bh = bw * bgImg.naturalHeight / bgImg.naturalWidth;
    ctx.drawImage(bgImg, -30 - curveCur * 24, (HORIZON + 4) - bh, bw, bh);
    const fg = ctx.createLinearGradient(0, HORIZON - 22, 0, HORIZON + 4);
    fg.addColorStop(0, hexA(TH.g1, 0));
    fg.addColorStop(1, hexA(TH.g1, 1));
    ctx.fillStyle = fg;
    ctx.fillRect(0, HORIZON - 22, W, 26);
  }
  if (!useBg) {
  // 空
  const sky = ctx.createLinearGradient(0, 0, 0, HORIZON);
  sky.addColorStop(0, TH.sky[0]); sky.addColorStop(1, TH.sky[1]);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, HORIZON);
  if (TH.night) {  // 星
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 46; i++) {
      ctx.globalAlpha = 0.35 + 0.4 * Math.abs(Math.sin(elapsed * 1.5 + i));
      ctx.fillRect((i * 97) % W, (i * 57) % (HORIZON - 46) + 6, 2, 2);
    }
    ctx.globalAlpha = 1;
  }
  ctx.save();
  ctx.translate(-curveCur * 24, 0);
  // 太陽・月・夕日
  if (TH.sun === 'moon') {
    ctx.fillStyle = '#f4f1d8';
    ctx.beginPath(); ctx.arc(W - 66, 52, 20, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = TH.sky[0];
    ctx.beginPath(); ctx.arc(W - 57, 45, 17, 0, Math.PI * 2); ctx.fill();
  } else if (TH.sun === 'sunset') {
    ctx.fillStyle = '#ffdf8a';
    ctx.beginPath(); ctx.arc(96, HORIZON - 24, 34, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffb347';
    ctx.beginPath(); ctx.arc(96, HORIZON - 24, 27, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.fillStyle = '#ffe9a0'; ctx.globalAlpha = 0.35;
    ctx.beginPath(); ctx.arc(W - 66, 52, 30, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#f7d774';
    ctx.beginPath(); ctx.arc(W - 66, 52, 24, 0, Math.PI * 2); ctx.fill();
  }
  // 遠景レイヤー
  if (TH.back === 'hills') {
    ctx.fillStyle = TH.mtn;
    ctx.beginPath();
    ctx.moveTo(-40, HORIZON); ctx.lineTo(40, HORIZON - 74); ctx.lineTo(110, HORIZON);
    ctx.lineTo(190, HORIZON - 58); ctx.lineTo(260, HORIZON); ctx.closePath(); ctx.fill();
    ctx.fillStyle = TH.hill;
    ctx.beginPath();
    ctx.moveTo(-40, HORIZON); ctx.quadraticCurveTo(90, HORIZON - 52, 210, HORIZON);
    ctx.quadraticCurveTo(320, HORIZON - 40, W + 40, HORIZON); ctx.closePath(); ctx.fill();
  } else if (TH.back === 'sea') {
    ctx.fillStyle = TH.sea;
    ctx.fillRect(-40, HORIZON - 34, W + 80, 34);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (let i = 0; i < 12; i++) {
      const wx = ((i * 67 + Math.floor(dist / 30) * 13) % (W + 60)) - 30;
      ctx.fillRect(wx, HORIZON - 26 + (i % 3) * 9, 16, 2);
    }
    ctx.fillStyle = TH.sand;
    ctx.fillRect(-40, HORIZON - 4, W + 80, 4);
  } else if (TH.back === 'city') {
    ctx.fillStyle = TH.city;
    let bx = -30;
    for (let i = 0; bx < W + 40; i++) {
      const bw = 30 + (i * 37) % 26, bh = 34 + (i * 53) % 62;
      ctx.fillRect(bx, HORIZON - bh, bw, bh);
      bx += bw + 4;
    }
  } else if (TH.back === 'dunes') {
    ctx.fillStyle = TH.dune2;
    ctx.beginPath();
    ctx.moveTo(-40, HORIZON); ctx.quadraticCurveTo(120, HORIZON - 44, 300, HORIZON); ctx.closePath(); ctx.fill();
    ctx.fillStyle = TH.dune;
    ctx.beginPath();
    ctx.moveTo(140, HORIZON); ctx.quadraticCurveTo(300, HORIZON - 30, W + 40, HORIZON); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  }
  if (!TH.night && !(useBg && themeIdx === 3)) clouds.forEach(drawCloud);
  // 地面：縞（距離で流れて速度感を出す）
  ctx.fillStyle = TH.g1; ctx.fillRect(0, HORIZON, W, H - HORIZON);
  const bandN = 7;
  const boff = stripePhase;
  ctx.fillStyle = TH.g2;
  for (let i = 0; i < bandN; i += 2) {
    let t = (i + boff) / bandN; if (t > 1) t -= 1;
    const t2 = Math.min(1, t + 1 / bandN);
    ctx.fillRect(0, projY(t), W, projY(t2) - projY(t) + 1);
  }
  // 道路（カーブに沿って中心がずれる帯）
  ctx.fillStyle = TH.road;
  ctx.beginPath();
  const SEG = 12;
  for (let i = 0; i <= SEG; i++) {
    const t = i / SEG, x = centerX(t) - roadHalf(t), y = projY(t);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  for (let i = SEG; i >= 0; i--) {
    const t = i / SEG;
    ctx.lineTo(centerX(t) + roadHalf(t), projY(t));
  }
  ctx.closePath(); ctx.fill();
  // 縁石（流れるストライプ）※速いときは薄く・長く＝残像っぽくしてチカチカを抑える
  const stripeN = 7;
  const off = stripePhase;
  const dashLen = 0.055 + Math.min(0.10, lastV * 0.00022);
  ctx.globalAlpha = stripeAlpha;
  for (let i = 0; i < stripeN; i++) {
    let t = (i + off) / stripeN; if (t > 1) t -= 1;
    const t2 = Math.min(1, t + dashLen);
    const c1 = centerX(t), c2 = centerX(t2);
    for (const side of [-1, 1]) {
      ctx.fillStyle = (i % 2 === 0) ? '#e8e8e8' : '#d84a4a';
      ctx.beginPath();
      ctx.moveTo(c1 + side * roadHalf(t), projY(t));
      ctx.lineTo(c2 + side * roadHalf(t2), projY(t2));
      ctx.lineTo(c2 + side * (roadHalf(t2) + 5 + t2 * 9), projY(t2));
      ctx.lineTo(c1 + side * (roadHalf(t) + 5 + t * 9), projY(t));
      ctx.closePath(); ctx.fill();
    }
    // 中央線
    if (i % 2 === 0) {
      ctx.fillStyle = '#f5f0c8';
      const w1 = 1.5 + t * 5, w2 = 1.5 + t2 * 5;
      ctx.beginPath();
      ctx.moveTo(c1 - w1 / 2, projY(t)); ctx.lineTo(c1 + w1 / 2, projY(t));
      ctx.lineTo(c2 + w2 / 2, projY(t2)); ctx.lineTo(c2 - w2 / 2, projY(t2));
      ctx.closePath(); ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

function drawSceneryObj(o) {

  const x = centerX(t) + o.side * (roadHalf(t) + (12 + t * 95) * o.off);
  const y = projY(t);
  const s = objScale(t) * 1.5;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);

    ctx.fillStyle = '#8a5a33'; roundRect(-3, -16, 6, 16, 2); ctx.fill();

  } else if (o.type === 'palm') {
    ctx.strokeStyle = '#8a5a33'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(4, -18, 9, -30); ctx.stroke();
    ctx.strokeStyle = '#3f9e4d'; ctx.lineWidth = 4;
    for (let i = 0; i < 5; i++) {
      const a = -0.4 - i * 0.5;

      ctx.stroke();
    }
    ctx.fillStyle = '#7a4a21';
    ctx.beginPath(); ctx.arc(6, -27, 3.4, 0, Math.PI * 2); ctx.arc(13, -26, 3.4, 0, Math.PI * 2); ctx.fill();
  } else if (o.type === 'lamp') {

    ctx.beginPath(); ctx.moveTo(0, -38); ctx.quadraticCurveTo(8, -42, 13, -38); ctx.lineTo(13, -34); ctx.quadraticCurveTo(8, -37, 0, -33); ctx.closePath(); ctx.fill();

    ctx.beginPath(); ctx.arc(13, -32, 3.6, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = '#3f9e4d';

    roundRect(8, -28, 6, 16, 3); ctx.fill(); roundRect(2, -20, 12, 6, 3); ctx.fill();

function drawFuelCan(f) {

    ctx.beginPath(); ctx.ellipse(x, y + 3, w * 0.42, 4.5 * s, 0, 0, Math.PI * 2); ctx.fill();

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold 52px sans-serif';
  ctx.fillText('燃料ラン！', W / 2, 208);
  ctx.font = '16px sans-serif';
  ctx.fillText('基本オートアクセル。左右に動くだけ！', W / 2, 292);
  ctx.fillText('赤い「燃」缶を拾って燃料を保ち、', W / 2, 320);
  ctx.fillText('茶色い「水」缶はエンジン不調！避けろ', W / 2, 346);
  ctx.fillText('どこまで走れるか競おう（速度上限なし）', W / 2, 372);
  ctx.font = '14px sans-serif'; ctx.fillStyle = '#cfe3ff';
  ctx.fillText('操作：←→キー ／ 画面ドラッグ', W / 2, 408);
  if (best > 0) { ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 17px sans-serif'; ctx.fillText('自己ベスト ' + (best / 1000).toFixed(2) + ' km', W / 2, 438); }
  ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 22px sans-serif';
  ctx.fillText('タップ / スペースでスタート', W / 2, 505);
}

function drawBoom() {
  const age = (performance.now() - boomT0) / 1000;
  if (age < 0 || age > 1) return;
  const bx = centerX(0.92) + px * roadHalf(0.92), by = projY(0.92) - 36;
  const r = 20 + age * 150, a = 1 - age;
  ctx.save();
  for (const [rr, col] of [[1, '#ff7b2e'], [0.68, '#ffb347'], [0.4, '#fff3b0']]) {
    ctx.fillStyle = col; ctx.globalAlpha = a * 0.9;
    ctx.beginPath(); ctx.arc(bx, by, r * rr, 0, Math.PI * 2); ctx.fill();
  }
  ctx.strokeStyle = '#ff7b2e'; ctx.globalAlpha = a; ctx.lineWidth = 4;
  for (let i = 0; i < 8; i++) {
    const ang = i * Math.PI / 4 + 0.4;
    ctx.beginPath();
    ctx.moveTo(bx + Math.cos(ang) * r * 0.8, by + Math.sin(ang) * r * 0.8);
    ctx.lineTo(bx + Math.cos(ang) * r * 1.25, by + Math.sin(ang) * r * 1.25);
    ctx.stroke();
  }
  ctx.restore();
}
function drawOver() {
  drawRoad();
  if (overReason !== 'bomb') drawPlayer();
  ctx.fillStyle = 'rgba(20,28,44,.62)'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
  ctx.font = 'bold 38px sans-serif';
  ctx.fillText(overReason === 'bomb' ? '💥 爆発…！' : 'ガス欠…！', W / 2, 210);
  if (overReason === 'bomb') {
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#ffb3a0';
    ctx.fillText('水缶10個目でエンジンが限界を迎えた', W / 2, 238);
  }
  ctx.font = '16px sans-serif';
  ctx.fillText('記録', W / 2, 268);
  ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 48px sans-serif';
  ctx.fillText((Math.floor(dist) / 1000).toFixed(2) + ' km', W / 2, 322);
  ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif';
  ctx.fillText('自己ベスト ' + (best / 1000).toFixed(2) + ' km', W / 2, 362);
  if (Math.floor(dist) >= best && best > 0) {
    ctx.fillStyle = '#7ee787'; ctx.font = 'bold 18px sans-serif';
    ctx.fillText('🎉 ベスト更新！', W / 2, 394);
  }
  ctx.fillStyle = '#ffd23e'; ctx.font = 'bold 20px sans-serif';
  ctx.fillText('タップ / スペースでもう一回', W / 2, 470);
}

function draw() {
  if (state === 'title') { drawTitle(); return; }
  ctx.save();
  if (sputterT > 0) ctx.translate((Math.random() - .5) * 7, (Math.random() - .5) * 7);  // 不調時は画面が揺れる
  drawRoad();
  // 遠い順に描く（景色→アイテム）
  [...scenery].sort((a, b) => b.z - a.z).forEach(drawSceneryObj);
  [...fuels].sort((a, b) => a.t - b.t).forEach(drawFuelCan);
  drawPlayer();
  ctx.restore();
  drawHUD();
  if (state === 'over') { drawOver(); if (overReason === 'bomb') drawBoom(); }
}

// ===== メインループ =====
let lastTs = 0;
function loop(ts) {
  const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0);
  lastTs = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
